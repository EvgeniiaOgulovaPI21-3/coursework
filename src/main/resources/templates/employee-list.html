<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Сотрудники — PINK</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/css/list.css" rel="stylesheet">
</head>
<body>
<div th:insert="~{blocks/header.html :: header}"></div>

<!-- Фиксированная кнопка создания -->
<div class="create-btn-container" th:if="${authorized && isAdmin}">
    <a th:href="@{/employee-create}" class="create-btn" title="Добавить сотрудника">
        <i class="bi bi-plus"></i>
    </a>
</div>

<div class="container">
    <div class="search-container mb-4">
        <form th:action="@{/employee}" method="get" class="position-relative" id="searchForm">
            <div class="d-flex align-items-center" style="max-width: 600px;">
                <i class="bi bi-search search-icon position-absolute"></i>
                <input type="text"
                       name="keyword"
                       th:value="${keyword}"
                       class="search-input"
                       placeholder="Поиск по имени или должности..."
                       aria-label="Поиск"
                       id="searchInput">
                <button type="submit" class="btn btn-link p-0 ms-2">
                    <i class="bi bi-arrow-right-circle-fill" style="color: var(--primary-color); font-size: 2.5rem;"></i>
                </button>
            </div>
        </form>
        <small class="text-muted ms-2">Введите имя, фамилию, отчество или должность сотрудника</small>
    </div>

    <div class="alert alert-info" th:if="${employee != null and employee.isEmpty()}">
        <i class="bi bi-info-circle me-2"></i>К сожалению, по вашему запросу ничего не найдено
    </div>

    <div class="employee-grid">
        <div th:each="employee : ${employee}">
            <div class="employee-card">
                <img th:src="@{${employee.imageUrl}}" alt="[[${employee.fullName}]]" class="employee-image"
                     th:onerror="this.src='/images/default-employee.jpg'">
                <div class="employee-body">
                    <div>
                        <div class="employee-title" th:text="${employee.fullName}"></div>
                        <div class="employee-position" th:text="${employee.position}"></div>
                        <div class="employee-phone">
                            <i class="bi bi-telephone me-2"></i>
                            <span th:text="${employee.phone}"></span>
                        </div>
                    </div>
                    <div class="action-buttons" th:if="${authorized && isAdmin}">
                        <a th:href="@{employee-update/{id}(id=${employee.id})}" class="action-btn edit" title="Редактировать">
                            <i class="bi bi-pencil"></i>
                        </a>
                        <a th:href="@{employee-delete/{id}(id=${employee.id})}" class="action-btn delete" title="Удалить"
                           onclick="return confirm('Вы действительно хотите удалить этого сотрудника?')">
                            <i class="bi bi-trash"></i>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:insert="~{blocks/footer.html :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
<script>
    document.addEventListener("DOMContentLoaded", function() {
        // Обработчик формы поиска
        const form = document.querySelector('#searchForm');
        const input = document.querySelector('#searchInput');

        if (form) {
            form.addEventListener('submit', function(e) {
                if (input.value.trim() === '') {
                    e.preventDefault();
                    window.location.href = '/employee';
                    return;
                }
            });
        }

        // Подсчет количества сотрудников
        const employeeCount = document.querySelectorAll('.employee-card').length;
        const counterElement = document.createElement('div');
        counterElement.className = 'text-muted text-center mb-3';
        counterElement.innerHTML = `Найдено сотрудников: ${employeeCount}`;
        document.querySelector('.container').appendChild(counterElement);
    });
</script>
</body>
</html>
