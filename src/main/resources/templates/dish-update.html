<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
  <link href="/css/create_update_forms.css" rel="stylesheet">
  <title>Редактирование блюда</title>
</head>
<body>

<header th:insert="~{blocks/header.html :: header}"></header>

<div class="container mt-5 mb-5">
  <div class="row justify-content-center">
    <div class="col-lg-8">
      <div class="form-card">
        <div class="form-header">
          <h1 class="h4 mb-0"><i class="bi bi-pencil"></i> Редактирование блюда</h1>
        </div>

        <form th:action="@{/dish-update}" th:object="${dish}" method="post" id="CUForm" class="needs-validation" novalidate>
          <input type="hidden" th:field="*{id}">

          <div class="form-group-row">
            <div class="form-group">
              <label for="name" class="form-label required-field">Название блюда</label>
              <input type="text"
                     th:field="*{name}"
                     id="name"
                     class="form-control"
                     placeholder="Например: Паста карбонара"
                     required>
              <div class="invalid-feedback">Пожалуйста, введите название блюда</div>
            </div>

            <div class="form-group">
              <label for="price" class="form-label required-field">Цена (₽)</label>
              <div class="input-group has-validation">
                <input type="number"
                       th:field="*{price}"
                       id="price"
                       class="form-control"
                       placeholder="350"
                       min="0"
                       required>
                <span class="input-group-text">₽</span>
                <div class="invalid-feedback">Пожалуйста, введите цену блюда</div>
              </div>
            </div>
          </div>

          <div class="mb-4">
            <label for="imageUrl" class="form-label required-field">Ссылка на изображение</label>
            <input type="text"
                   th:field="*{imageUrl}"
                   id="imageUrl"
                   class="form-control"
                   placeholder="https://…"
                   required>
              <small class="text-muted">
                Введите полный URL изображения (например, https://example.com/image.jpg)<br>
                Поддерживаются: .jpg, .jpeg, .png, .gif
              </small>
            <div class="invalid-feedback">Введите корректный URL изображения</div>
          </div>

          <div class="mb-4">
            <label for="description" class="form-label">Описание блюда</label>
            <textarea th:field="*{description}"
                      id="description"
                      class="form-control"
                      rows="3"
                      placeholder="Вкусное описание вашего блюда..."></textarea>
          </div>

          <div class="mb-4">
            <label for="energyValue" class="form-label">Энергетическая ценность (КБЖУ)</label>
            <textarea th:field="*{energyValue}"
                      id="energyValue"
                      class="form-control"
                      rows="1">
            </textarea>
            <small class="text-muted">Введите данные в формате: 648/26/47/30</small>
          </div>

          <div class="d-flex justify-content-between">
            <a th:href="@{/dish}" class="btn btn-secondary">
              <i class="bi bi-arrow-left me-2"></i>Назад к списку
            </a>
            <button type="submit" class="btn btn-primary">
              <i class="bi bi-check-lg me-2"></i>Сохранить изменения
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

<footer th:insert="~{blocks/footer.html :: footer}"></footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
<script src="/js/DD-validation.js" defer></script>
</body>
</html>
