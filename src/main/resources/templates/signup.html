<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/css/header-footer.css" rel="stylesheet">
    <link href="/css/authorization.css" rel="stylesheet">
</head>
<body>
<div th:insert="~{blocks/header.html :: header}"></div>

<div class="container">
    <div class="auth-container">
        <form th:action="@{/registration}" method="POST" id="registerForm" th:object="${user}">
            <h1 class="h3 mb-4 auth-header"><i class="bi bi-person-plus me-2"></i>Регистрация</h1>

            <!-- Поле логина -->
            <div class="form-floating mb-3">
                <input type="text"
                       th:field="*{login}"
                       class="form-control"
                       th:classappend="${#fields.hasErrors('login')} ? 'is-invalid'"
                       id="login"
                       placeholder="Логин"
                       required>
                <label for="login">Логин</label>
                <div class="invalid-feedback" th:if="${#fields.hasErrors('login')}">
                    <i class="bi bi-exclamation-circle me-1"></i>
                    <span th:errors="*{login}"></span>
                </div>
            </div>

            <!-- Поле пароля -->
            <div class="form-floating mb-3">
                <input type="password"
                       th:field="*{password}"
                       class="form-control"
                       th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'"
                       id="password"
                       placeholder="Пароль"
                       required>
                <label for="password">Пароль</label>
                <div class="invalid-feedback" th:if="${#fields.hasErrors('password')}">
                    <i class="bi bi-exclamation-circle me-1"></i>
                    <span th:errors="*{password}"></span>
                </div>
            </div>

            <!-- Поле подтверждения пароля -->
            <div class="form-floating mb-3">
                <input type="password"
                       name="confirmPassword"
                       class="form-control"
                       id="confirmPassword"
                       placeholder="Подтвердите пароль"
                       required>
                <label for="confirmPassword"><i class="bi bi-lock me-2"></i>Подтвердите пароль</label>

<!--                &lt;!&ndash; Сообщение о несовпадении паролей &ndash;&gt;-->
<!--                <div class="invalid-feedback" th:if="${passwordsNotMatch}">-->
<!--                    <i class="bi bi-exclamation-circle me-1"></i>-->
<!--                    Пароли не совпадают!-->
<!--                </div>-->
            </div>
            <button class="w-100 btn btn-lg btn-primary mt-3" type="submit">
                <i class="bi bi-person-check me-2"></i>Зарегистрироваться
            </button>

            <div class="auth-footer">
                Уже есть аккаунт? <a class="auth-link" th:href="@{/login}">Войти</a>
            </div>
        </form>
    </div>
</div>
<footer th:insert="~{blocks/footer.html :: footer}"></footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/signup.js" defer></script>
</body>
</html>
