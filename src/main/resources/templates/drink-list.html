<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Напитки — PINK</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
  <link href="/css/list.css" rel="stylesheet">
</head>
<body>
<div th:insert="~{blocks/header.html :: header}"></div>

<!-- Фиксированная кнопка создания -->
<div class="create-btn-container" th:if="${authorized && isAdmin}">
  <a th:href="@{/drink-create}" class="create-btn" title="Создать новый напиток">
    <i class="bi bi-plus"></i>
  </a>
</div>

<div class="container">
  <div class="search-container mb-4">
    <form th:action="@{/drink}" method="get" class="position-relative" id="searchForm">
      <div class="d-flex align-items-center" style="max-width: 600px;">
        <i class="bi bi-search search-icon position-absolute"></i>
        <input type="text"
               name="keyword"
               th:value="${keyword}"
               class="search-input"
               placeholder="Поиск по названию или цене..."
               aria-label="Поиск"
               id="searchInput">
        <button type="submit" class="btn btn-link p-0 ms-2">
          <i class="bi bi-arrow-right-circle-fill" style="color: var(--primary-color); font-size: 2.5rem;"></i>
        </button>
      </div>
    </form>
    <small class="text-muted ms-2">Введите название или максимальную цену (например: 500)</small>
  </div>
  <div class="alert alert-info" th:if="${drink != null and drink.isEmpty()}">
    <i class="bi bi-info-circle me-2"></i>К сожалению, по вашему запросу ничего не найдено
  </div>
  <div class="drink-grid">
    <div th:each="drink : ${drink}">
      <div class="drink-card">
        <img th:src="@{${drink.imageUrl}}" alt="[[${drink.name}]]" class="drink-image">
        <div class="drink-body">
          <div>
            <div class="drink-title" th:text="${drink.name}"></div>
            <div class="price" th:text="${drink.price} + ' ₽'"></div>
          </div>
          <div>
            <div class="toggle-buttons">
              <button type="button" class="btn-toggle toggle-description" data-drink-id="[[${drink.id}]]">
                <i class="bi bi-chevron-down" aria-hidden="true"></i><span>Описание</span>
              </button>
              <button type="button" class="btn-toggle toggle-kbju" data-drink-id="[[${drink.id}]]">
                <i class="bi bi-chevron-down" aria-hidden="true"></i><span>КБЖУ</span>
              </button>
            </div>
            <div class="description-content" id="description-[[${drink.id}]]">
              <p th:text="${drink.description}">Описание блюда</p>
            </div>
            <div class="kbju-content" id="energyValue-[[${drink.id}]]">
              <pre th:text="${drink.energyValue}"></pre>
            </div>
          </div>
          <div class="action-buttons" th:if="${authorized && isAdmin}">
            <a th:href="@{drink-update/{id}(id=${drink.id})}" class="action-btn edit" title="Редактировать">
              <i class="bi bi-pencil"></i>
            </a>
            <a th:href="@{drink-delete/{id}(id=${drink.id})}" class="action-btn delete" title="Удалить" onclick="return confirm('Вы действительно хотите удалить это блюдо?')">
              <i class="bi bi-trash"></i>
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<div th:insert="~{blocks/footer.html :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
<script src="/js/drink-list.js" defer></script>
</body>
</html>
