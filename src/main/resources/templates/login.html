<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
  <link href="/css/header-footer.css" rel="stylesheet">
  <link href="/css/authorization.css" rel="stylesheet">
</head>
<body>
<div th:insert="~{blocks/header.html :: header}"></div>

<div class="container">
  <div class="auth-container">
    <form th:action="@{/execute_login}" method="POST">
      <h1 class="h3 mb-4 auth-header"><i class="bi bi-door-open me-2"></i>Вход</h1>

      <div class="form-floating">
        <input type="text" name="username" class="form-control" id="floatingInput" placeholder="Ваш логин" required>
        <label for="floatingInput"><i class="bi bi-person me-2"></i>Логин</label>
      </div>

      <div class="form-floating">
        <input type="password" name="password" class="form-control" id="floatingPassword" placeholder="Ваш пароль" required>
        <label for="floatingPassword"><i class="bi bi-lock me-2"></i>Пароль</label>
      </div>

      <div th:if="${param.error}" class="error-message-login">
        <i class="bi bi-exclamation-triangle me-2"></i>Неверный логин или пароль!
      </div>

      <button class="w-100 btn btn-lg btn-primary mt-3" type="submit">
        <i class="bi bi-box-arrow-in-right me-2"></i>Войти
      </button>

      <div class="auth-footer">
        Ещё не зарегистрированы? <a class="auth-link" th:href="@{/registration}">Создать аккаунт</a>
      </div>
    </form>
  </div>
</div>
<footer th:insert="~{blocks/footer.html :: footer}"></footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
