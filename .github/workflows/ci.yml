name: CI/CD Pipeline

on:
  push:
    branches:
      - main  # Запускать процесс при пуше в основную ветку
  pull_request:
    branches:
      - main  # Запускать процесс при создании Pull Request в основную ветку

jobs:
  build:
    runs-on: ubuntu-latest  # Запускать на виртуальной машине с Ubuntu

    steps:
      - name: Checkout code
        uses: actions/checkout@v2  # Клонирование репозитория

      - name: Set up Java
        uses: actions/setup-java@v2
        with:
          java-version: '11'  # Устанавливаем нужную версию Java (например, Java 11)

      - name: Cache Maven dependencies
        uses: actions/cache@v2
        with:
          path: ~/.m2/repository  # Кешируем зависимости Maven, чтобы ускорить сборку
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build with Maven
        run: mvn clean install -DskipTests=true  # Сборка проекта без выполнения тестов

      - name: Run tests
        run: mvn test  # Запуск всех unit-тестов

      - name: Upload test results
        uses: actions/upload-artifact@v2
        with:
          name: test-results
          path: target/surefire-reports  # Загружаем отчеты о тестах для дальнейшего анализа
